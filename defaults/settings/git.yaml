append:
  permissions:
    commands:
      deny:
        - "git add *"
        - "git am *"
        - "git apply *"
        - "git archive *"
        - "git branch *"
        - "git checkout *"
        - "git cherry-pick *"
        - "git clean *"
        - "git commit *"
        - "git format-patch *"
        - "git gc *"
        - "git merge *"
        - "git mv *"
        - "git prune *"
        - "git pull *"
        - "git push *"
        - "git rebase *"
        - "git reflog *"
        - "git replace *"
        - "git request-pull *"
        - "git reset *"
        - "git restore *"
        - "git revert *"
        - "git rm *"
        - "git send-email *"
        - "git sparse-checkout *"
        - "git stash *"
        - "git submodule *"
        - "git switch *"
        - "git bundle *"
