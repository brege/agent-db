[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-db"
version = "0.2.3"
description = "Global Claude Code and Codex config maintainer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pydantic>=2.11.0",
  "PyYAML>=6.0",
  "rich>=13.5.2",
]

[dependency-groups]
dev = [
  "pre-commit>=3.8",
  "pytest>=8.4.0",
  "ruff>=0.16.0",
  "ty>=0.0.17",
]

[project.scripts]
agent-db = "agent_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.ty.src]
include = ["src/agent_db", "tests", "tools"]
respect-ignore-files = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP"]
