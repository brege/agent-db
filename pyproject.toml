[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-db"
version = "0.1.0"
description = "Global Claude Code and Codex config maintainer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "rich>=13.5.2",
]

[project.scripts]
agent-db = "agent_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
